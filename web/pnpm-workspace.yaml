# pnpm v12 reads project settings from this file, not from `pnpm` in package.json.
#
# GHSA-g3hv-75wg-m249 (Dependabot alert #14) has no patch inside minimatch's
# `^10` or `^5` ranges, so every copy in the tree is pinned to the first
# patched release. `@redocly/openapi-core@1` calls minimatch as a default
# export, which 11.x removed — `patches/` carries the one-line fix.
overrides:
  minimatch: 11.0.1
patchedDependencies:
  '@redocly/openapi-core@1.34.20': patches/@redocly__openapi-core@1.34.20.patch
