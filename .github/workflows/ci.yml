name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-run-names:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fail on duplicate check-run names
        run: python3 .github/scripts/check_unique_check_names.py

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen || uv sync
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest -x

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint branch commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  # Issue #87. Builds the deployable image with no secrets in the environment and
  # then exercises the contract that matters: one process, one origin, API and web
  # app both answering, a deep link surviving a refresh, and `/health` leaking
  # nothing. Deliberately credential-free — if this job ever needs a secret to
  # build, that is a bug in the build, not a missing secret.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # DOCKER_BUILDKIT=0 on purpose. `gcloud run deploy --source .` builds with
        # gcr.io/cloud-builders/docker, which does not enable BuildKit — so a
        # BuildKit-only instruction (e.g. --mount=type=cache) fails on the deploy
        # path while passing here, because runners default BuildKit on. Pinning it
        # off makes CI build the way the deploy actually builds.
        env:
          DOCKER_BUILDKIT: '0'
        run: docker build -t hongxplore:ci .
      - name: Start it with no keys configured
        run: |
          docker run -d --name hongxplore -p 8080:8080 \
            -e DEMO_MODE=true \
            -e AGENT_ACCESS_KEYS= \
            hongxplore:ci
      - name: Wait for /health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs hongxplore
          exit 1
      - name: Smoke test the demo-only deployment
        run: .github/scripts/smoke_container.sh demo
      - name: The image carries no secrets and runs as non-root
        run: .github/scripts/audit_image.sh hongxplore:ci
      # The 401/403 key distinction is only observable on an instance that is
      # allowed to be live at all, so the gate gets a second container.
      - name: Restart as a live-capable instance
        run: |
          docker rm -f hongxplore
          docker run -d --name hongxplore -p 8080:8080 \
            -e DEMO_MODE=false \
            -e AGENT_ACCESS_KEYS=ci-pitch-key \
            hongxplore:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::container never became healthy"
          docker logs hongxplore
          exit 1
      - name: Smoke test the live-mode gate
        run: .github/scripts/smoke_container.sh live
      - name: Show logs and stop
        if: always()
        run: |
          docker logs hongxplore 2>&1 | tail -40
          docker rm -f hongxplore 2>/dev/null || true

