name: Keep Hongxplore warm

# Cloud Run scales to zero, so an idle service is cold — and a cold start in front
# of judges is a real risk (issue #87, ADR-0006).
#
# This pings /health often enough that Cloud Run does not reclaim the instance
# during a pitch. It needs no deployment secret: the deployed URL is public, so
# it lives in a repository *variable*, not a secret. A scheduled ping costs
# nothing and stays inside the free tier's 2M requests/month by a wide margin.
#
# Setup, once, by a human (see docs/DEPLOY.md):
#   gh variable set HONGXPLORE_DEPLOY_URL --body 'https://<service>-<hash>.run.app'

on:
  schedule:
    # Every 5 minutes. Cloud Run's scale-to-zero window is generous enough that
    # this comfortably keeps one instance warm; `cron` has a minimum granularity
    # of 5 minutes and schedules on UTC.
    - cron: '*/5 * * * *'
  # Ping once on deploy so the new revision is warm before anyone sees it.
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          DEPLOY_URL: ${{ vars.HONGXPLORE_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::HONGXPLORE_DEPLOY_URL is not set — nothing to keep warm. \
          Set it with: gh variable set HONGXPLORE_DEPLOY_URL --body '<deploy-url>'"
            exit 0
          fi

          url="${DEPLOY_URL%/}/health"
          echo "GET $url"
          if curl -fsS --max-time 20 --retry 2 --retry-delay 2 "$url"; then
            echo
            echo "::notice::service is warm"
          else
            echo "::error::keep-warm ping failed — the deployed service is not responding. \
          If this repeats during a pitch, deploy a new revision or check Cloud Run logs."
            exit 1
          fi
